# Publishes the benchmark container (container/Dockerfile) to GitHub's
# registry as ghcr.io/<owner>/riggrade-bench. Runs only when started by hand
# on main. The image carries the runner and spec only, never the grading
# server. Buyers run it by digest, so record the digest this prints in
# container/bench-image.env before the server accepts its bundles.
name: publish-bench
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-bench
  cancel-in-progress: false
jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space for the vLLM base image
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - name: Run the tests first
        run: python3 -m unittest discover -s tests -t . -q
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/riggrade-bench"
          docker build -f container/Dockerfile \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${GITHUB_SHA} \
            --label org.opencontainers.image.licenses=Apache-2.0 \
            -t "$IMAGE:${GITHUB_SHA}" .
          docker push "$IMAGE:${GITHUB_SHA}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${GITHUB_SHA}" | cut -d@ -f2)
          case "$DIGEST" in sha256:*) ;; *) echo "no digest" >&2; exit 1;; esac
          {
            echo "Image: $IMAGE@$DIGEST"
            echo "Record in container/bench-image.env: RIGGRADE_IMAGE_DIGESTS=$DIGEST"
          } | tee -a "$GITHUB_STEP_SUMMARY"
