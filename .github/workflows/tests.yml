name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The Coinbase facilitator's JWT signing needs cryptography (optional
      # extra "cdp"); installed here so its tests run, skipped if absent.
      - run: python -m pip install --quiet cryptography
      - run: python -m unittest discover -s tests -t . -v
