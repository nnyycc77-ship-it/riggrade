# Publishes the riggrade package to PyPI by trusted publishing: GitHub's
# OIDC identity, no API token anywhere. It runs only when the owner has
# registered this repository, this workflow file name and the "pypi"
# environment as a trusted publisher on his PyPI project; until then the
# publish step is refused by PyPI and nothing else happens. Triggered by
# publishing a GitHub release (the owner's act); run by hand, it only
# builds and keeps the sdist and wheel as a run artifact (with SHA-256s
# in the summary) for review, and never publishes.
name: publish-pypi
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests first
        run: python -m unittest discover -s tests -t . -q
      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet build
          python -m build
          sha256sum dist/* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
