# Builds the grading server image into Artifact Registry.
#   gcloud builds submit --config deploy/cloudbuild.yaml .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/server.Dockerfile",
           "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/riggrade/server:latest", "."]
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/riggrade/server:latest
substitutions:
  _REGION: us-central1
