[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riggrade"
version = "0.2.0"
description = "Independent GPU rig grading: free preflight check, paid x402 grade, MCP server"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []
keywords = ["gpu", "benchmark", "mcp", "x402", "agents"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
cdp = ["cryptography>=42"]  # only the server needs it, for the Coinbase facilitator's JWT

[project.urls]
Homepage = "https://github.com/nnyycc77-ship-it/riggrade"
Service = "https://riggrade-674098696181.us-central1.run.app/riggrade/v1"

[project.scripts]
riggrade-mcp = "riggrade.mcp:main"
riggrade-preflight = "runner.preflight:main"
riggrade-verify = "riggrade.verify:main"

[tool.setuptools]
packages = ["riggrade", "runner", "pricewatch"]
include-package-data = true

[tool.setuptools.package-data]
riggrade = ["spec/*.json", "index/*.json", "index/*.csv"]
